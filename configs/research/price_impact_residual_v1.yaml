study:
  name: price_impact_residual_v1
  hypothesis: 공통 주문압력 대비 덜 움직인 자산은 이후 15분 동안 catch-up한다

protocol:
  path: research_protocols/price_impact_residual_v1.md
  seal_path: research_protocols/price_impact_residual_v1.seal.json

data:
  symbols:
    - BTC-USDT
    - ETH-USDT
    - XRP-USDT
    - SOL-USDT
    - DOGE-USDT
    - ADA-USDT
    - AVAX-USDT
  start_inclusive: "2025-10-08T00:00:00Z"
  end_exclusive: "2026-04-06T00:00:00Z"
  interval_minutes: 1
  minimum_active_assets: 6
  flow_archive_root: ../herding/data/okx_tick_archive
  l2_module: "4"
  instrument_type: SPOT

sample_split:
  development_start: "2025-10-08T00:00:00Z"
  development_end_exclusive: "2025-12-07T00:00:00Z"
  oos_start: "2025-12-07T00:00:00Z"
  oos_end_exclusive: "2026-04-06T00:00:00Z"

model:
  expected_impact_target: common_direction_x_observed_midpoint_return
  predictors:
    - absolute_common_flow
    - aligned_local_flow
    - spread_bps
    - log_top10_depth
    - aligned_book_imbalance
    - utc_hour_sin
    - utc_hour_cos
    - asset_fixed_effects
  winsor_quantiles: [0.005, 0.995]

events:
  common_flow_absolute_percentile: 0.95
  portfolio_assets_per_side: 2
  primary_direction: catch_up
  falsification_direction: reversal
  primary_non_overlap_minutes: 15

execution:
  horizons_minutes: [1, 5, 15, 30]
  primary_horizon_minutes: 15
  round_trip_cost_bps: [4, 8, 12]
  primary_round_trip_cost_bps: 8
  sweep_quote_amounts: [10000, 50000, 100000]
  primary_sweep_quote_amount: 10000
  require_full_top10_fill: true

analysis:
  bootstrap_repetitions: 499
  random_seed: 20260726
  fdr_alpha: 0.05
  minimum_non_overlap_oos_events: 100
  minimum_assets_positive: 4
  require_positive_oos_halves: true
  require_positive_mean_and_median: true

output:
  base_dir: outputs/v2/price_impact_residual_v1

logging:
  level: INFO
